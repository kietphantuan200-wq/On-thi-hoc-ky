var bn={x:20,y:20,vx:1.3,vy:0.9,w:70,h:80,jumpStart:0,jumping:false,face:1};
var app=document.getElementById("app");
function bananaLoop(now){
  var W=Math.max(app.clientWidth-70,100);
  var H=Math.min(Math.max(app.clientHeight-80,300),560);
  bn.x+=bn.vx; bn.y+=bn.vy;
  if(bn.x<=0){bn.x=0;bn.vx=Math.abs(bn.vx);bn.face=1;}
  if(bn.x>=W){bn.x=W;bn.vx=-Math.abs(bn.vx);bn.face=-1;}
  if(bn.y<=0){bn.y=0;bn.vy=Math.abs(bn.vy);}
  if(bn.y>=H){bn.y=H;bn.vy=-Math.abs(bn.vy);}
  var jy=0, scaleStr="";
  if(bn.jumping){
    var t=(now-bn.jumpStart)/450;
    if(t>=1){bn.jumping=false;}
    else{ jy=-Math.sin(t*Math.PI)*110; var st=Math.sin(t*Math.PI); scaleStr=" scaleY("+(1+st*0.25)+") scaleX("+(1-st*0.15)+")"; }
  }
  bananaEl.style.transform="translate("+bn.x+"px,"+(bn.y+jy)+"px) scaleX("+bn.face+")"+scaleStr;
  requestAnimationFrame(bananaLoop);
}
requestAnimationFrame(bananaLoop);
bananaEl.addEventListener("click",function(e){
  e.stopPropagation();
  boing();
  bn.jumping=true; bn.jumpStart=performance.now();

});

function applyTheme(t){
  app.style.background=t.bg;
  var root=document.documentElement.style;
  root.setProperty('--accent',t.accent); root.setProperty('--accent-soft',t.accentSoft);
  root.setProperty('--accent2',t.accent2); root.setProperty('--bg',t.bg);
  root.setProperty('--card',t.card); root.setProperty('--text',t.text);
  root.setProperty('--muted',t.muted); root.setProperty('--border',t.border);
  root.setProperty('--wrong',t.wrong); root.setProperty('--wrong-soft',t.wrongSoft);
}

function lbKey(k){return "quiz_lb_"+k;}
function getLB(k){try{return JSON.parse(localStorage.getItem(lbKey(k))||"[]");}catch(e){return[];}}
function saveLB(k,name,score,total){
  var d=getLB(k);
  d.push({name:name,score:score,total:total,pct:Math.round(score/total*100),date:new Date().toLocaleDateString("vi-VN")});
  localStorage.setItem(lbKey(k),JSON.stringify(d.slice(-200)));
}
function aggregateLB(k){
  var d=getLB(k), map={};
  d.forEach(function(e){
    var key=e.name.toLowerCase();
    if(!map[key] || e.pct>map[key].pct){ map[key]={name:e.name,score:e.score,total:e.total,pct:e.pct,date:e.date,attempts:(map[key]?map[key].attempts:0)+1}; }
    else { map[key].attempts++; }
  });
  var arr=[]; for(var k2 in map) arr.push(map[k2]);
  arr.sort(function(a,b){return b.pct-a.pct||b.score-a.score;});
  return arr;
}

function startQuiz(key){
  state.subject=SUBJECTS[key]; state.idx=0; state.score=0; state.saved=false; state.answers=[];
  for(var i=0;i<state.subject.q.length;i++) state.answers.push(null);
  renderQuiz();
}

function renderQuiz(){
  var sub=state.subject; applyTheme(sub);
  var i=state.idx, item=sub.q[i];
  var pct=Math.round((i/sub.q.length)*100);
  var answered=state.answers[i]!==null;
  var optsHtml="";
  for(var k=0;k<4;k++){

    if(answered){ if(k===item.a) extra=" correct"; else if(k===state.answers[i].chosen) extra=" wrong"; else extra=" dim"; }
    optsHtml+='<div class="opt'+extra+(answered?" locked":"")+'" data-i="'+k+'" style="display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border-radius:14px;margin-bottom:10px;">'+

      '<span style="font-size:15px;line-height:1.5;padding-top:4px;">'+item.o[k]+'</span></div>';
  }
  var fbHtml="";

}

function renderResult(){
  var sub=state.subject; applyTheme(sub);
  if(!state.saved){ saveLB(sub.key,state.name,state.score,sub.q.length); state.saved=true; winSound(); }
  var sc=state.score,total=sub.q.length,pct=Math.round(sc/total*100);
  var msg,color;
  if(pct>=90){msg="Xuất sắc!";color="var(--accent)";}else if(pct>=70){msg="Khá tốt!";color="var(--accent)";}else if(pct>=50){msg="Cần ôn thêm!";color="var(--accent2)";}else{msg="Cần cố gắng hơn!";color="var(--wrong)";}
  var lb=aggregateLB(sub.key); var rank=0;
  for(var r=0;r<lb.length;r++){ if(lb[r].name.toLowerCase()===state.name.toLowerCase()){ rank=r+1; break; } }
  var circle=2*Math.PI*52;
  var wrongList="",wc=0;
  state.answers.forEach(function(a,idx){
    if(a&&!a.ok){ wc++; var it=sub.q[idx];
      wrongList+='<div style="padding:10px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--bg);">'+
        '<div style="font-size:12px;font-weight:600;color:var(--wrong);margin-bottom:3px;">Câu '+(idx+1)+' · Bạn chọn '+letters[a.chosen]+'</div>'+
        '<div style="font-size:13px;line-height:1.5;margin-bottom:4px;">'+it.q+'</div>'+
        '<div style="font-size:12px;color:var(--accent);font-weight:500;">Đúng: '+letters[it.a]+'. '+it.o[it.a]+'</div></div>';
    }
  });
  if(wc===0) wrongList='<div style="text-align:center;color:var(--accent);font-weight:600;padding:16px;">Bạn đã làm đúng toàn bộ '+total+' câu!</div>';
  main.innerHTML='<div class="card" style="padding:26px 20px;text-align:center;margin-bottom:14px;">'+
    '<div style="display:inline-block;background:var(--accent-soft);color:var(--accent);padding:5px 14px;border-radius:999px;font-size:12px;font-weight:600;margin-bottom:12px;">'+sub.name+'</div>'+
    '<h2 style="font-size:19px;font-weight:700;margin:0 0 14px;">Kết quả của '+state.name+'</h2>'+
    '<div style="position:relative;width:130px;height:130px;margin:0 auto 12px;">'+
      '<svg width="130" height="130" viewBox="0 0 140 140"><circle cx="70" cy="70" r="52" fill="none" stroke="var(--bg)" stroke-width="12"/><circle cx="70" cy="70" r="52" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+circle+'" stroke-dashoffset="'+(circle*(1-pct/100))+'" transform="rotate(-90 70 70)"/></svg>'+
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div style="font-size:28px;font-weight:700;color:'+color+';">'+sc+'/'+total+'</div><div style="font-size:12px;color:var(--muted);">'+pct+'%</div></div></div>'+
    '<div style="font-size:16px;font-weight:600;color:'+color+';margin-bottom:4px;">'+msg+'</div>'+
    '<div style="font-size:13px;color:var(--muted);margin-bottom:4px;">Đúng '+sc+' · Sai '+(total-sc)+(rank>0?' · Hạng #'+rank+' / '+lb.length+' người':'')+'</div>'+
    '<div style="font-size:12px;color:var(--accent);font-weight:600;margin-bottom:18px;">✓ Đã lưu công khai vào BXH</div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">'+
      '<button class="btn" id="retryBtn" style="background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:14px;font-size:13px;font-weight:600;font-family:inherit;">Làm lại</button>'+
      '<button class="btn" id="lbBtn" style="background:#fff;color:var(--accent);border:2px solid var(--accent);padding:11px 22px;border-radius:14px;font-size:13px;font-weight:600;font-family:inherit;">Xem BXH</button>'+
      '<button class="btn" id="menuBtn" style="background:#fff;color:var(--muted);border:2px solid var(--border);padding:11px 22px;border-radius:14px;font-size:13px;font-weight:600;font-family:inherit;">Về menu</button></div></div>'+
    (wc>0?'<div class="card" style="padding:16px;"><h3 style="font-size:15px;font-weight:600;margin:0 0 10px;color:var(--wrong);">Câu cần ôn lại ('+wc+')</h3>'+wrongList+'</div>':'');
  document.getElementById("retryBtn").onclick=function(){startQuiz(sub.key);};
  document.getElementById("lbBtn").onclick=function(){renderLeaderboard(sub.key,false);};
  document.getElementById("menuBtn").onclick=function(){renderMenu();};
}

function renderLeaderboard(key, isPublic){
  var sub=SUBJECTS[key]; applyTheme(sub);
  var lb=aggregateLB(key);
  var rows="";
  if(lb.length===0){ rows='<div style="text-align:center;color:var(--muted);padding:28px;font-size:14px;">Chưa có lượt thi nào. Hãy là người đầu tiên!</div>'; }
  else{
    lb.slice(0,20).forEach(function(e,idx){
      var medal=idx===0?"🥇":idx===1?"🥈":idx===2?"🥉":(idx+1)+".";
      var isMe=(state.name && e.name.toLowerCase()===state.name.toLowerCase())?'border:2px solid var(--accent);background:var(--accent-soft);':'';
      rows+='<div class="lb-row" style="'+isMe+'">'+
        '<div style="display:flex;align-items:center;gap:10px;min-width:0;"><span style="font-weight:700;width:28px;text-align:center;flex-shrink:0;font-size:15px;">'+medal+'</span>'+
        '<div style="min-width:0;"><div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;">'+e.name+'</div>'+
        '<div style="font-size:11px;color:var(--muted);">Thi '+e.attempts+' lần · gần nhất '+e.date+'</div></div></div>'+
        '<div style="text-align:right;flex-shrink:0;"><div style="font-weight:700;color:var(--accent);font-size:15px;">'+e.score+'/'+e.total+'</div>'+
        '<div style="font-size:11px;color:var(--muted);font-weight:600;">'+e.pct+'%</div></div></div>';
    });
  }
  var backBtn = isPublic
    ? '<button class="btn" id="backHome" style="flex:1;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:14px;font-size:14px;font-weight:600;font-family:inherit;">← Về trang chào</button>'
    : '<button class="btn" id="backMenu" style="flex:1;background:#fff;color:var(--muted);border:2px solid var(--border);padding:12px;border-radius:14px;font-size:14px;font-weight:600;font-family:inherit;">Về menu</button>';
  main.innerHTML='<div class="card" style="padding:22px 18px;">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;">'+
      '<h2 style="font-size:18px;font-weight:700;margin:0;color:var(--accent);">🏆 BXH công khai</h2>'+
      '<span style="font-size:12px;background:var(--accent-soft);color:var(--accent);padding:4px 12px;border-radius:999px;font-weight:600;">'+sub.short+'</span></div>'+
    '<p style="font-size:12px;color:var(--muted);margin:0 0 4px;">'+sub.name+' · Top 20 (gộp theo từng người, lấy điểm cao nhất)</p>'+
    '<p style="font-size:11px;color:var(--accent2);font-weight:600;margin:0 0 14px;">💡 Gợi ý: bấm vào chuối vàng để xem nó nhảy!</p>'+
    rows+
    '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">'+
      '<button class="btn" id="doQuiz" style="flex:1;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:14px;font-size:14px;font-weight:600;font-family:inherit;">Làm bài này</button>'+
      backBtn+'</div></div>';
  document.getElementById("doQuiz").onclick=function(){ if(!state.name){ renderWelcome(); return; } startQuiz(key); };
  var bh=document.getElementById("backHome"); if(bh) bh.onclick=function(){renderWelcome();};
  var bm=document.getElementById("backMenu"); if(bm) bm.onclick=function(){renderMenu();};
}

renderWelcome();
})();
</script>
</html>
