function handleAvatarFile(file,cb){if(!file)return;var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){var c=document.createElement('canvas');c.width=96;c.height=96;var ctx=c.getContext('2d');var s=Math.min(img.width,img.height);var sx=(img.width-s)/2,sy=(img.height-s)/2;ctx.drawImage(img,sx,sy,s,s,0,0,96,96);cb(c.toDataURL('image/jpeg',0.7));};img.src=rd.result;};rd.readAsDataURL(file);}
function handleBackgroundFile(file,cb){if(!file)return;var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){var scale=Math.min(1,1800/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.84));};img.src=rd.result;};rd.readAsDataURL(file);}

function overallLB(){
  var map={};['lsdl','cn','khtn'].forEach(function(k){aggLB(k).forEach(function(e){if(!map[e.userId])map[e.userId]={userId:e.userId,username:e.username,score:0,total:0,subjects:0};map[e.userId].score+=e.score;map[e.userId].total+=e.total;map[e.userId].subjects++;});});
  var a=Object.keys(map).map(function(k){var e=map[k];e.pct=e.total?Math.round(e.score/e.total*100):0;return e;});
  a.sort(function(x,y){return y.score-x.score||y.pct-x.pct;});return a;
}

function startQuiz(key){
  if(key==='cn'&&isCNCompleted(ME)){alert('Môn Công Nghệ đã thi xong. Mày không thể vào thi lại.');renderHome();return;}
  st.subject=SUBS[key];st.idx=0;st.score=0;st.saved=false;st.answers=[];
  for(var i=0;i<st.subject.q.length;i++)st.answers.push(null);
  renderQuiz();
}

function renderQuiz(){
  applyTheme();
  var sub=st.subject,i=st.idx,item=sub.q[i];
  setStatus('quiz',{subject:sub.short,qIndex:i+1,total:sub.q.length});

  var opts='';

    opts+='<div class="opt'+ex+(answered?' locked':'')+'" data-i="'+k+'" style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;margin-bottom:8px;">'+
      '<span class="badge" style="background:var(--accent-soft);color:var(--accent);font-size:13px;">'+letters[k]+'</span>'+
      '<span style="font-size:14px;line-height:1.5;padding-top:3px;color:var(--text);">'+item.o[k]+'</span></div>';
  }
  var fb='';
  if(answered){var ok=st.answers[i].ok;fb='<div style="margin:6px 0 12px;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;line-height:1.5;background:'+(ok?'var(--accent-soft)':'rgba(220,38,38,.1)')+';color:'+(ok?'var(--accent)':'#dc2626')+';">'+(ok?'<b>Chính xác!</b> Đáp án '+letters[item.a]:'<b>Chưa đúng.</b> Đáp án đúng: '+letters[item.a]+'. '+item.o[item.a])+'</div>';}
  var nav='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:14px;">';
  for(var j=0;j<sub.q.length;j++){var c='';if(st.answers[j]!==null)c+=st.answers[j].ok?'background:var(--accent);color:#fff;border-color:var(--accent);':'background:#dc2626;color:#fff;border-color:#dc2626;';if(j===i)c+='box-shadow:0 0 0 2px var(--accent2-soft);';nav+='<span data-jump="'+j+'" style="width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text);'+c+'">'+(j+1)+'</span>';}
  nav+='</div>';
  main.innerHTML='<div class="card" style="padding:20px 16px;">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;">'+
      '<span style="font-size:11px;font-weight:700;color:#fff;background:var(--accent);padding:3px 10px;border-radius:999px;">'+sub.short+'</span>'+

  modal.onclick=function(e){if(e.target===modal)closeUserProfile2();};
  setTimeout(function(){var i=document.getElementById('cloud-input');if(i)i.focus();},400);
};
window.renderCloudLog2=function(){
  if(!viewingUser)return;
  var key=chatKey2(ME.id,viewingUser.id), chats=getChats();
  var msgs=chats[key]||[];
  var log=document.getElementById('cloud-log');
  if(!log)return;
  if(!msgs.length)log.innerHTML='<div class="c-empty">Hay nhan tin gi do — doi phuong se thay ban dang nhap real-time!</div>';
  else log.innerHTML=msgs.map(function(m){return '<div class="c-msg '+(m.from===ME.id?'me':'them')+'">'+m.text.replace(/</g,'&lt;')+'</div>';}).join('');
  log.scrollTop=log.scrollHeight;
  var mine=msgs.filter(function(m){return m.from===ME.id;}).slice(-3);
  var mm=document.getElementById('um-msgs');if(mm)mm.innerHTML=mine.map(function(m){return '<div class="um-msg">'+ME.username+': '+m.text.replace(/</g,'&lt;')+'</div>';}).join('');
};
window.sendCloudMsg2=function(){
  var inp=document.getElementById('cloud-input');
  if(!inp||!viewingUser)return;
  var txt=inp.value.trim();
  if(!txt)return;
  var key=chatKey2(ME.id,viewingUser.id), chats=getChats();
  if(!chats[key])chats[key]=[];
  chats[key].push({from:ME.id,text:txt});
  saveChats(chats);
  inp.value='';
  var live=document.getElementById('um-live');if(live)live.style.display='none';
  renderCloudLog2();
  if(autoReplyTimer)clearTimeout(autoReplyTimer);
  var fid=viewingUser.id;
  autoReplyTimer=setTimeout(function(){
    var ty=document.getElementById('cloud-typing');
    if(ty){ty.style.display='flex';var lb=document.getElementById('cloud-typing-label');if(lb)lb.textContent=viewingUser.username+' dang nhap...';}
    autoReplyTimer=setTimeout(function(){
      var rep=AUTO_REPLIES2[replyIdx2%AUTO_REPLIES2.length];replyIdx2++;
      var c2=getChats();var k2=chatKey2(ME.id,fid);if(!c2[k2])c2[k2]=[];
      c2[k2].push({from:fid,text:rep});saveChats(c2);
      var ty2=document.getElementById('cloud-typing');if(ty2)ty2.style.display='none';
      renderCloudLog2();
    },1500);
  },800);
};
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='cloud-input'&&viewingUser){
    var v=e.target.value.trim();
    var live=document.getElementById('um-live');
    if(!live)return;
    if(v){live.style.display='block';live.textContent=ME.username+' dang nhap: "'+v+'"';}

});
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.id==='cloud-input'&&e.key==='Enter')sendCloudMsg2();
});
document.addEventListener('click',function(e){
  if(e.target&&e.target.id==='cloud-send')sendCloudMsg2();
});
function thanosSnap2(el,container,done){
  var rect=el.getBoundingClientRect(), crect=container.getBoundingClientRect();
  var w=rect.width,h=rect.height;
  var canvas=document.createElement('canvas');
  canvas.id='snap-canvas';canvas.width=w*2;canvas.height=h*2;
  canvas.style.left=(rect.left-crect.left)+'px';canvas.style.top=(rect.top-crect.top)+'px';
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  container.appendChild(canvas);
  var ctx=canvas.getContext('2d');ctx.scale(2,2);
  var colors=['#ffffff','#ede9fe','#c4b5fd','#fbcfe8','#f5d0fe'];
  var ps=[];var cols=12,rows=9,cw=w/cols,ch=h/rows;
  for(var i=0;i<cols;i++)for(var j=0;j<rows;j++){
    if(Math.random()<0.3)continue;
    ps.push({x:i*cw+Math.random()*cw,y:j*ch+Math.random()*ch,vx:(Math.random()-0.5)*1.6,vy:-(Math.random()*2.2+0.6),size:Math.random()*3.5+1.5,color:colors[(Math.random()*colors.length)|0],life:1,decay:0.006+Math.random()*0.012,rot:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.12});
  }
  el.style.transition='opacity .3s ease';el.style.opacity='0';el.style.pointerEvents='none';
  var t=0;
  function frame(){
    ctx.clearRect(0,0,w,h);var alive=false;
    for(var i=0;i<ps.length;i++){var p=ps[i];if(p.life<=0)continue;alive=true;
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.015;p.vx*=0.99;p.rot+=p.vr;p.life-=p.decay;
      ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore();}
    t++;
    if(alive&&t<220)requestAnimationFrame(frame);
    else{canvas.remove();el.remove();done&&done();}
  }
  frame();
}
window.closeUserProfile2=function(){
  var cloud=document.getElementById('cloud-widget');
  var card=document.getElementById('um-card');
  var modal=document.getElementById('userModal');
  if(autoReplyTimer){clearTimeout(autoReplyTimer);autoReplyTimer=null;}
  if(cloud&&card){
    var bye=document.createElement('div');bye.className='bye-pop';bye.textContent='Hello~ Bye~ ';
    var r=cloud.getBoundingClientRect(),cr=card.getBoundingClientRect();
    bye.style.left=(r.left-cr.left+70)+'px';bye.style.top=(r.top-cr.top-6)+'px';
    card.appendChild(bye);
    var mir=document.getElementById('um-mirror');if(mir){mir.style.transition='opacity .4s';mir.style.opacity='0';}
    setTimeout(function(){
      thanosSnap2(cloud,card,function(){
        modal.classList.remove('open');modal.innerHTML='';viewingUser=null;
      });
    },500);
  }else{
    modal.classList.remove('open');modal.innerHTML='';viewingUser=null;
  }
};
