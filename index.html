];
var letters=["A","B","C","D"];
var app=document.getElementById("app");
var state={idx:0,score:0,answers:[]};
for(var i=0;i<Q.length;i++) state.answers.push(null);

function navHtml(){
  var h='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;">';
  for(var i=0;i<Q.length;i++){
    var cls="qnav";
    if(state.answers[i]!==null) cls+= state.answers[i].ok?" done-ok":" done-no";
    if(i===state.idx) cls+=" current";
    h+='<span class="'+cls+'" data-jump="'+i+'">'+(i+1)+'</span>';
  }
  h+='</div>';
  return h;
}

function renderStart(){
  state.idx=0;state.score=0;
  for(var i=0;i<Q.length;i++) state.answers[i]=null;
  app.innerHTML='<div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 28px;text-align:center;box-shadow:0 8px 30px rgba(15,23,42,.06);">'+
    '<div style="display:inline-block;background:var(--accent-soft);color:var(--accent);padding:6px 16px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:18px;">40 CÂU TRẮC NGHIỆM</div>'+
    '<h1 style="font-size:28px;font-weight:700;margin:0 0 8px;line-height:1.25;">Quiz Ôn Tập<br>Công Nghệ 8 - Vẽ Kỹ Thuật</h1>'+
    '<p style="color:var(--muted);font-size:14px;margin:0 0 6px;">Giữa học kỳ I · Năm học 2026 - 2027 · Từ bài 1 đến bài 4</p>'+
    '<p style="color:var(--accent2);font-size:13px;margin:0 0 24px;font-weight:500;">Đề thực tế là môn Công Nghệ (vẽ kỹ thuật), không phải Vật lý</p>'+
    '<div style="display:flex;gap:12px;justify-content:center;margin-bottom:28px;flex-wrap:wrap;">'+
      '<div style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 18px;min-width:90px;"><div style="font-size:22px;font-weight:700;color:var(--accent);">40</div><div style="font-size:12px;color:var(--muted);">câu hỏi</div></div>'+
      '<div style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 18px;min-width:90px;"><div style="font-size:22px;font-weight:700;color:var(--accent2);">4</div><div style="font-size:12px;color:var(--muted);">lựa chọn</div></div>'+
      '<div style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 18px;min-width:90px;"><div style="font-size:22px;font-weight:700;color:#0f172a;">45</div><div style="font-size:12px;color:var(--muted);">phút (tham khảo)</div></div>'+
    '</div>'+
    '<button id="startBtn" class="btn" style="background:var(--accent);color:#fff;border:none;padding:14px 40px;border-radius:14px;font-size:16px;font-weight:600;font-family:inherit;box-shadow:0 4px 14px rgba(41,122,46,.3);">Bắt đầu làm bài</button>'+
  '</div>';
  document.getElementById("startBtn").onclick=function(){renderQuestion();};
}

function renderQuestion(){
  var i=state.idx, item=Q[i];
  var pct=Math.round((i/Q.length)*100);
  var answered=state.answers[i]!==null;
  var optsHtml="";
  for(var k=0;k<4;k++){
    var extra="";
    if(answered){
      if(k===item.a) extra=" correct";
      else if(k===state.answers[i].chosen) extra=" wrong";
      else extra=" dim";
    }
    optsHtml+='<div class="opt'+extra+(answered?" locked":"")+'" data-i="'+k+'" style="display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:14px;margin-bottom:10px;">'+
      '<span class="badge" style="background:var(--bg);border:1.5px solid var(--border);color:var(--muted);font-size:14px;">'+letters[k]+'</span>'+
      '<span style="font-size:15px;line-height:1.5;padding-top:4px;">'+item.o[k]+'</span></div>';
  }
  var fbHtml="";
  if(answered){
    var ok=state.answers[i].ok;
    fbHtml='<div style="margin-top:6px;margin-bottom:14px;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;line-height:1.5;background:'+(ok?"var(--accent-soft)":"var(--wrong-soft)")+';color:'+(ok?"var(--accent)":"var(--wrong)")+';">'+
      (ok?'<span style="font-weight:700;">Chính xác!</span> Đáp án đúng là '+letters[item.a]+'.':
      '<span style="font-weight:700;">Chưa đúng.</span> Đáp án đúng là <b>'+letters[item.a]+'</b>: '+item.o[item.a])+'</div>';
  }
  var nextLabel=(i===Q.length-1)?"Xem kết quả":"Câu tiếp theo";
  app.innerHTML='<div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px 20px;box-shadow:0 8px 30px rgba(15,23,42,.06);">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">'+
      '<span style="font-size:13px;font-weight:600;color:var(--muted);">Câu '+(i+1)+' / '+Q.length+'</span>'+
      '<span style="font-size:12px;font-weight:600;color:var(--accent);">Đã đúng: '+state.score+'</span>'+
    '</div>'+
    '<div style="height:8px;background:var(--bg);border-radius:999px;overflow:hidden;margin-bottom:20px;"><div class="progress-fill" style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;"></div></div>'+
    '<h2 style="font-size:17px;font-weight:600;margin:0 0 18px;line-height:1.5;">'+item.q+'</h2>'+
    '<div id="opts">'+optsHtml+'</div>'+
    fbHtml+
    '<div style="display:flex;gap:10px;margin-top:6px;">'+
      (i>0?'<button id="prevBtn" class="btn" style="flex:1;background:var(--bg);color:var(--text);border:1.5px solid var(--border);padding:13px;border-radius:14px;font-size:15px;font-weight:600;font-family:inherit;">Câu trước</button>':'')+
      '<button id="nextBtn" class="btn" style="flex:2;background:'+(answered?"var(--accent)":"#e2e8f0")+';color:'+(answered?"#fff":"#94a3b8")+';border:none;padding:13px;border-radius:14px;font-size:15px;font-weight:600;font-family:inherit;" '+(answered?"":"disabled")+'>'+nextLabel+'</button>'+
    '</div>'+
    navHtml()+
  '</div>';

  if(!answered){
    var optEls=document.querySelectorAll(".opt");
    optEls.forEach(function(el){
      el.onclick=function(){
        var chosen=parseInt(el.getAttribute("data-i"));
        var correct=item.a;
        var ok=(chosen===correct);
        state.answers[i]={ok:ok,chosen:chosen};
        if(ok) state.score++;
        renderQuestion();
      };
    });
  }
  document.getElementById("nextBtn").onclick=function(){
    if(i===Q.length-1){renderResult();}
    else{state.idx++;renderQuestion();}
  };
  var pb=document.getElementById("prevBtn");
  if(pb) pb.onclick=function(){state.idx--;renderQuestion();};
  document.querySelectorAll(".qnav").forEach(function(el){
    el.onclick=function(){state.idx=parseInt(el.getAttribute("data-jump"));renderQuestion();};
  });
}

function renderResult(){
  var sc=state.score, total=Q.length;
  var pct=Math.round(sc/total*100);
  var msg,color;
  if(pct>=90){msg="Xuất sắc!";color="var(--accent)";}
  else if(pct>=70){msg="Khá tốt!";color="var(--accent)";}
  else if(pct>=50){msg="Cần ôn thêm!";color="var(--accent2)";}
  else{msg="Cần cố gắng hơn!";color="var(--wrong)";}
  var wrongList="";
  var wrongCount=0;
  state.answers.forEach(function(a,idx){
    if(a && !a.ok){
      wrongCount++;
      var item=Q[idx];
      wrongList+='<div style="padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);">'+
        '<div style="font-size:13px;font-weight:600;color:var(--wrong);margin-bottom:4px;">Câu '+(idx+1)+' · Bạn chọn '+letters[a.chosen]+'</div>'+
        '<div style="font-size:14px;line-height:1.5;margin-bottom:6px;">'+item.q+'</div>'+
        '<div style="font-size:13px;color:var(--accent);font-weight:500;">Đáp án đúng: '+letters[item.a]+'. '+item.o[item.a]+'</div></div>';
    }
  });
  if(wrongCount===0) wrongList='<div style="text-align:center;color:var(--accent);font-weight:600;padding:20px;">Bạn đã làm đúng toàn bộ 40 câu!</div>';
  var circle=2*Math.PI*52;
  app.innerHTML='<div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 20px;box-shadow:0 8px 30px rgba(15,23,42,.06);text-align:center;margin-bottom:16px;">'+
    '<h2 style="font-size:22px;font-weight:700;margin:0 0 20px;">Kết quả của bạn</h2>'+
    '<div style="position:relative;width:140px;height:140px;margin:0 auto 16px;">'+
      '<svg width="140" height="140" viewBox="0 0 140 140">'+
        '<circle cx="70" cy="70" r="52" fill="none" stroke="var(--bg)" stroke-width="12"/>'+
        '<circle cx="70" cy="70" r="52" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+circle+'" stroke-dashoffset="'+(circle*(1-pct/100))+'" transform="rotate(-90 70 70)"/>'+
      '</svg>'+
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">'+
        '<div style="font-size:32px;font-weight:700;color:'+color+';">'+sc+'/'+total+'</div>'+
        '<div style="font-size:13px;color:var(--muted);">'+pct+'%</div>'+
      '</div></div>'+
    '<div style="font-size:18px;font-weight:600;color:'+color+';margin-bottom:6px;">'+msg+'</div>'+
    '<div style="font-size:14px;color:var(--muted);margin-bottom:20px;">Đúng '+sc+' câu · Sai '+(total-sc)+' câu</div>'+
    '<button id="retryBtn" class="btn" style="background:var(--accent);color:#fff;border:none;padding:12px 32px;border-radius:14px;font-size:15px;font-weight:600;font-family:inherit;box-shadow:0 4px 14px rgba(41,122,46,.3);">Làm lại từ đầu</button>'+
  '</div>'+
  (wrongCount>0?'<div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(15,23,42,.06);">'+
    '<h3 style="font-size:16px;font-weight:600;margin:0 0 14px;color:var(--wrong);">Những câu cần ôn lại ('+wrongCount+')</h3>'+
    wrongList+'</div>':'');
  document.getElementById("retryBtn").onclick=renderStart;
}

renderStart();
})();
</script>
</html>
