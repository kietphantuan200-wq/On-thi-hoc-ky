  {q:"Câu 1: Trong các câu sau, câu nào chỉ hiện tượng vật lí?",o:["Đường cháy thành than.","Cơm bị ôi thiu.","Sữa chua lên men.","Nước hóa đá dưới 0°C."],a:3,ex:"Nước hóa đá dưới 0°C chỉ là sự thay đổi trạng thái từ thể lỏng sang thể rắn của nước, không sinh ra chất mới nên là hiện tượng vật lí."},
  {q:"Câu 2: Một vật thể bằng sắt để ngoài trời, sau một thời gian bị gỉ. Hỏi khối lượng của vật thay đổi thế nào so với khối lượng của vật trước khi gỉ?",o:["Tăng.","Giảm.","Không thay đổi.","Không thể biết."],a:0,ex:"Khi sắt bị gỉ, sắt (Fe) đã phản ứng kết hợp với oxygen (O2) và hơi nước trong không khí tạo thành gỉ sắt (Fe2O3.nH2O). Khối lượng gỉ sắt = mFe + mO2 + mH2O nên lớn hơn khối lượng sắt ban đầu (Tăng)."},
  {q:"Câu 3: Acid có trong dạ dày của người và động vật giúp tiêu hóa thức ăn là:",o:["Sulfuric acid.","Acetic acid.","Stearic acid.","Hydrochloric acid."],a:3,ex:"Dịch vị dạ dày chứa acid hydrochloric (HCl) nồng độ khoảng 0,0001 đến 0,001 M (pH ≈ 1.5 - 3.5) giúp tiêu hóa thức ăn chứa protein."},
  {q:"Câu 4: Mol là lượng chất có chứa bao nhiêu hạt vi mô (nguyên tử, phân tử, ...) của chất đó?",o:["6,022 x 10^22.","6,022 x 10^23.","6,022 x 10^24.","6,022 x 10^25."],a:1,ex:"Theo định nghĩa tiêu chuẩn, 1 mol chứa số Avogadro (N = 6,022 × 10²³) hạt vi mô."},
  {q:"Câu 5: Khối lượng nguyên tử oxygen là 16 amu, khối lượng mol (M) nguyên tử của oxygen là:",o:["32 kg/mol.","16 kg/mol.","16 g/mol.","32 g/mol."],a:2,ex:"Khối lượng mol nguyên tử (tính bằng g/mol) có trị số bằng khối lượng nguyên tử (tính bằng amu). Oxygen có khối lượng nguyên tử 16 amu nên M = 16 g/mol."},
  {q:"Câu 6: Dung dịch H2SO4 loãng tác dụng với chất nào tạo ra khí hydrogen?",o:["NaOH.","Fe.","CaO.","CO2."],a:1,ex:"Kim loại Fe đứng trước H trong dãy hoạt động hóa học nên tác dụng với H2SO4 loãng giải phóng khí H2: Fe + H2SO4 -> FeSO4 + H2↑."},
  {q:"Câu 7: Khối lượng mol phân tử của Fe2O3 là:",o:["155 g/mol.","160 g/mol.","160 amu.","170 g/mol."],a:1,ex:"M(Fe2O3) = 56 × 2 + 16 × 3 = 112 + 48 = 160 g/mol."},
  {q:"Câu 8: Với 0,25 mol vôi sống CaO có khối lượng là:",o:["10 gam.","5 gam.","14 gam.","28 gam."],a:2,ex:"M(CaO) = 40 + 16 = 56 g/mol. m = n × M = 0,25 × 56 = 14 gam."},
  {q:"Câu 9: Khi hòa tan dầu ăn trong cốc xăng thì xăng đóng vai trò gì?",o:["Chất tan.","Dung môi.","Chất bảo hòa.","Chất chưa bảo hòa."],a:1,ex:"Xăng hòa tan được dầu ăn, do đó xăng là chất hòa tan chất khác nên gọi là dung môi."},
  {q:"Câu 10: Hai chất không thể hòa tan với nhau tạo thành dung dịch là:",o:["Nước và đường.","Dầu ăn và xăng.","Rượu và nước.","Dầu ăn và nước."],a:3,ex:"Dầu ăn không tan trong nước và nhẹ hơn nước nên tách lớp, không tạo thành dung dịch đồng nhất."},
  {q:"Câu 11: Thang pH được dùng để:",o:["Biểu thị độ acid của dung dịch.","Biểu thị độ base của dung dịch.","Biểu thị độ acid, base của dung dịch.","Biểu thị độ mặn của dung dịch."],a:2,ex:"Thang pH từ 1-14 được sử dụng để đánh giá độ acid (pH < 7), trung tính (pH = 7) hoặc độ base (pH > 7) của dung dịch."},
  {q:"Câu 12: Hòa tan 14,36 gam NaCl vào 40 gam nước ở 20°C thì được dung dịch bão hòa. Độ tan của NaCl ở nhiệt độ đó là:",o:["35,5 gam.","35,9 gam.","36,5 gam.","37,2 gam."],a:1,ex:"Độ tan S = (m_chất_tan / m_nước) × 100 = (14,36 / 40) × 100 = 35,9 gam (trên 100g H2O)."},
  {q:"Câu 13: Dãy gồm các kim loại tác dụng được với dung dịch H2SO4 loãng là:",o:["Fe, Cu, Mg.","Zn, Fe, Cu.","Zn, Fe, Al.","Fe, Zn, Ag."],a:2,ex:"Các kim loại đứng trước Hydrogen trong dãy hoạt động hóa học (như Zn, Fe, Al, Mg) tác dụng được với H2SO4 loãng. Cu và Ag đứng sau H nên không phản ứng."},
  {q:"Câu 14: Khi cho đường vào nước rồi đun lên, độ tan của đường trong nước sẽ thay đổi như thế nào?",o:["Tăng lên.","Giảm đi.","Không đổi.","Không xác định được."],a:0,ex:"Đối với đa số chất rắn (như đường, muối), độ tan trong nước tăng lên khi nhiệt độ tăng."},
  {q:"Câu 15: Chất tác dụng với nước tạo ra dung dịch base là:",o:["CO2.","Na2O.","SO2.","P2O5."],a:1,ex:"Oxide base của kim loại kiềm/kiềm thổ tác dụng với nước tạo thành dung dịch base (kiềm): Na2O + H2O -> 2NaOH."},
  {q:"Câu 16: Cho phản ứng: A + B -> C + D. Biểu thức về công thức khối lượng của các chất nào sau đây là đúng?",o:["mA + mB = mC + mD.","mA = mB + mC + mD.","mA + mB = mC - mD.","mA + mB - mC = mD."],a:0,ex:"Theo Định luật bảo toàn khối lượng, tổng khối lượng các chất tham gia phản ứng bằng tổng khối lượng các chất sản phẩm tạo thành."},
  {q:"Câu 17: Cho phương trình: 4Al + 3O2 -> 2Al2O3. Biết khối lượng Al phản ứng là 1,35 gam, lượng Al2O3 thu được là 2,55 gam. Lượng O2 đã tham gia phản ứng là:",o:["1,25 gam.","1,2 gam.","1,1 gam.","3,85 gam."],a:1,ex:"Theo định luật bảo toàn khối lượng: mAl + mO2 = mAl2O3 ⇒ mO2 = 2,55 - 1,35 = 1,2 gam."},
  {q:"Câu 18: Đốt phosphorus (P) trong khí oxygen (O2) thu được diphosphorus pentoxide (P2O5). Phương trình phản ứng nào sau đây đã viết đúng?",o:["4P + 5O2 -> 2P2O5.","2P + O2 -> P2O5.","P + O2 -> P2O5.","2P + 5O2 -> 2P2O5."],a:0,ex:"Cân bằng đúng số nguyên tử 2 vế: 4 nguyên tử P và 10 nguyên tử O ở cả 2 vế (4P + 5O2 -> 2P2O5)."},
  {q:"Câu 19: Tỉ khối của khí X đối với không khí nhỏ hơn 1 (d_X/KK < 1). X là khí nào sau đây?",o:["O2.","H2S.","CO2.","N2."],a:3,ex:"M_KK ≈ 29 g/mol. Khí N2 có M = 28 g/mol < 29 nên d(N2/KK) = 28/29 < 1 (nhẹ hơn không khí). O2(32), H2S(34), CO2(44) đều nặng hơn không khí."},
  {q:"Câu 20: Cho 5,6 g sắt tác dụng với HCl dư, sau phản ứng thể tích khí H2 thu được (ở đkc 25°C, 1 bar) là:",o:["1,24 lit.","2,479 lit.","12,4 lit.","24,79 lit."],a:1,ex:"nFe = 5,6 / 56 = 0,1 mol. PTHH: Fe + 2HCl -> FeCl2 + H2. nH2 = nFe = 0,1 mol. VH2 (đkc) = 0,1 × 24,79 = 2,479 lít."},
  {q:"Câu 21: Cho phương trình: 2KClO3 -> 2KCl + 3O2. Giả sử phản ứng hoàn toàn, từ 0,6 mol KClO3 sẽ thu được bao nhiêu mol khí oxygen?",o:["0,9 mol.","0,45 mol.","0,2 mol.","0,4 mol."],a:0,ex:"Theo PTHH: 2 mol KClO3 tạo ra 3 mol O2. Vậy 0,6 mol KClO3 sẽ tạo ra: nO2 = (0,6 × 3) / 2 = 0,9 mol."},
  {q:"Câu 22: Tốc độ phản ứng không phụ thuộc yếu tố nào sau đây?",o:["Thời gian xảy ra phản ứng.","Bề mặt tiếp xúc giữa các chất phản ứng.","Nồng độ các chất tham gia phản ứng.","Chất xúc tác."],a:0,ex:"Các yếu tố ảnh hưởng tốc độ phản ứng bao gồm: nồng độ, nhiệt độ, diện tích tiếp xúc, áp suất và chất xúc tác. Thời gian là đại lượng đo lường, không phải yếu tố ảnh hưởng đến tốc độ."},
  {q:"Câu 23: Cho thanh nhôm tác dụng với HCl thu được 26,7 gam muối nhôm và 0,6 gam khí H2. Tổng khối lượng các chất phản ứng (Al và HCl) là:",o:["26 gam.","27,3 gam.","26,1 gam.","25,5 gam."],a:1,ex:"Theo định luật bảo toàn khối lượng: m(chất phản ứng) = m(sản phẩm) = m_muối + m_H2 = 26,7 + 0,6 = 27,3 gam."},
  {q:"Câu 24: Yếu tố nào dưới đây được sử dụng để làm tăng tốc độ phản ứng khi rắc men vào tinh bột đã nấu chín để ủ rượu?",o:["Áp suất.","Chất xúc tác.","Nhiệt độ.","Nồng độ."],a:1,ex:"Men rượu chứa các enzyme đóng vai trò là chất xúc tác sinh học giúp tăng tốc quá trình lên men tinh bột thành ethanol."},
  {q:"Câu 25: Base nào sau đây là kiềm (base tan trong nước)?",o:["Ba(OH)2.","Cu(OH)2.","Mg(OH)2.","Fe(OH)3."],a:0,ex:"Ba(OH)2 là base tan tốt trong nước (dung dịch kiềm). Các base Cu(OH)2, Mg(OH)2, Fe(OH)3 là base không tan."},
  {q:"Câu 26: Dãy các base đều làm đổi màu quỳ tím ẩm (thành xanh) và dung dịch phenolphthalein (thành hồng) là:",o:["KOH, Ca(OH)2, Cu(OH)2, Zn(OH)2.","NaOH, Al(OH)3, Ba(OH)2, Cu(OH)2.","Ca(OH)2, KOH, Zn(OH)2, Fe(OH)3.","NaOH, KOH, Ca(OH)2, Ba(OH)2."],a:3,ex:"Chỉ có các dung dịch base tan (kiềm) như NaOH, KOH, Ca(OH)2, Ba(OH)2 mới làm quỳ tím hóa xanh và phenolphthalein hóa hồng."},
  {q:"Câu 27: Khối lượng H2O có trong 30 g dung dịch có nồng độ 3% là:",o:["10 g.","3 g.","29,1 g.","0,1 g."],a:2,ex:"m_chất_tan = (30 × 3) / 100 = 0,9 gam. Khối lượng nước m_H2O = m_dung_dịch - m_chất_tan = 30 - 0,9 = 29,1 gam."},
  {q:"Câu 28: Dãy chất gồm các oxide phi kim (acidic oxide) là:",o:["MgO, CO2, SO2, P2O5.","Na2O, CO2, SO3, NO2.","SiO2, N2O5, CO2, SO2.","K2O, CO2, NO, Fe2O3."],a:2,ex:"SiO2, N2O5, CO2, SO2 đều là oxide cấu thành từ phi kim (Si, N, C, S) kết hợp với oxygen."},

  {q:"Câu 30: Khối lượng NaOH có trong 300 ml dung dịch nồng độ 0,15 M là:",o:["1,8 g.","0,045 g.","4,5 g.","0,125 g."],a:0,ex:"V = 300ml = 0,3 lít. Số mol n = CM × V = 0,15 × 0,3 = 0,045 mol. M(NaOH) = 40 g/mol. m = 0,045 × 40 = 1,8 gam."}

function curUser(){return ME;}

function avImg(u){return u&&u.avatar?u.avatar:'';}
function avHtml(u,cls){cls=cls||'av';var img=avImg(u);return img?'<img class="'+cls+'" src="'+img+'">':'<div class="'+cls+'" style="display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:var(--accent);font-size:16px;">'+(u?u.username.charAt(0).toUpperCase():'?')+'</div>';}
function lbKey(k){return 'quiz_lb_'+k;}
function getLB(k){return get(lbKey(k),[]);}
function saveLB(k,userId,username,score,total){var d=getLB(k);d.push({userId:userId,username:username,score:score,total:total,pct:Math.round(score/total*100),date:new Date().toLocaleDateString('vi-VN')});set(lbKey(k),d.slice(-300));}
function aggLB(k){var d=getLB(k),m={};d.forEach(function(e){var key=e.userId;if(!m[key]||e.pct>m[key].pct){m[key]={username:e.username,userId:e.userId,score:e.score,total:e.total,pct:e.pct,date:e.date,attempts:(m[key]?m[key].attempts:0)+1};}else{m[key].attempts++;}});var a=[];for(var x in m)a.push(m[x]);a.sort(function(a,b){return b.pct-a.pct||b.score-a.score;});return a;}
function ago(t){var s=Math.floor((Date.now()-t)/1000);if(s<60)return s+' giây trước';if(s<3600)return Math.floor(s/60)+' phút trước';if(s<86400)return Math.floor(s/3600)+' giờ trước';return Math.floor(s/86400)+' ngày trước';}

/* ===== AVATAR UPLOAD ===== */
function handleAvatarFile(file,cb){if(!file)return;var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){var c=document.createElement('canvas');c.width=96;c.height=96;var ctx=c.getContext('2d');var s=Math.min(img.width,img.height);var sx=(img.width-s)/2,sy=(img.height-s)/2;ctx.drawImage(img,sx,sy,s,s,0,0,96,96);cb(c.toDataURL('image/jpeg',0.7));};img.src=rd.result;};rd.readAsDataURL(file);}

function startQuiz(key){
  st.subject=SUBS[key];st.idx=0;st.score=0;st.saved=false;st.answers=[];
  for(var i=0;i<st.subject.q.length;i++)st.answers.push(null);
  renderQuiz();
}

/* ===== QUIZ ENGINE VỚI GIẢI THÍCH CHI TIẾT NGAY KHI CHỌN ===== */
function renderQuiz(){
  applyTheme();
  var sub=st.subject,i=st.idx,item=sub.q[i];
  setStatus('quiz',{subject:sub.short,qIndex:i+1,total:sub.q.length});
  var pct=Math.round((i)/sub.q.length*100),answered=st.answers[i]!==null;
  var opts='';
  for(var k=0;k<4;k++){
    var ex='';if(answered){if(k===item.a)ex=' correct';else if(k===st.answers[i].chosen)ex=' wrong';else ex=' dim';}
    opts+='<div class="opt'+ex+(answered?' locked':'')+'" data-i="'+k+'" style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;margin-bottom:8px;">'+
      '<span class="badge" style="background:var(--accent-soft);color:var(--accent);font-size:13px;">'+letters[k]+'</span>'+
      '<span style="font-size:14px;line-height:1.5;padding-top:3px;color:var(--text);">'+item.o[k]+'</span></div>';
  }
  
  var fb='';
  if(answered){
    var ok=st.answers[i].ok;
    fb='<div style="margin:10px 0 14px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5;background:'+(ok?'var(--accent-soft)':'rgba(220,38,38,.08)')+';border:1.5px solid '+(ok?'var(--accent)':'#dc2626')+';">'+
      '<div style="font-weight:700;color:'+(ok?'var(--accent)':'#dc2626')+';margin-bottom:4px;display:flex;align-items:center;gap:6px;">'+
        '<span>'+(ok?'✓ CHÍNH XÁC!':'✗ CHƯA ĐÚNG!')+'</span>'+
        '<span>(Đáp án đúng: '+letters[item.a]+')</span>'+
      '</div>'+
      '<div style="color:var(--text);font-size:13px;background:rgba(255,255,255,.6);padding:8px 10px;border-radius:8px;margin-top:6px;border-left:3px solid '+(ok?'var(--accent)':'#dc2626')+';">'+
        '💡 <b>Giải thích chi tiết:</b> '+item.ex+
      '</div>'+
    '</div>';
  }
  
  var nav='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:14px;">';
  for(var j=0;j<sub.q.length;j++){
    var c='';
    if(st.answers[j]!==null)c+=st.answers[j].ok?'background:var(--accent);color:#fff;border-color:var(--accent);':'background:#dc2626;color:#fff;border-color:#dc2626;';
    if(j===i)c+='box-shadow:0 0 0 2.5px var(--accent2);';
    nav+='<span data-jump="'+j+'" style="width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text);'+c+'">'+(j+1)+'</span>';
  }
  nav+='</div>';
  
  main.innerHTML='<div class="card" style="padding:20px 16px;">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;">'+
      '<span style="font-size:11px;font-weight:700;color:#fff;background:'+(sub.color||'var(--accent)')+';padding:4px 12px;border-radius:999px;">'+sub.short+'</span>'+
      '<span style="font-size:12px;font-weight:600;color:var(--muted);">Câu '+(i+1)+'/'+sub.q.length+'</span>'+
      '<span style="font-size:11px;font-weight:700;color:var(--accent);">Đúng: '+st.score+'</span></div>'+
    '<div style="height:6px;background:rgba(128,128,128,.15);border-radius:999px;overflow:hidden;margin-bottom:16px;"><div class="progress-fill" style="height:100%;width:'+pct+'%;background:'+(sub.color||'var(--accent)')+';border-radius:999px;"></div></div>'+
    '<h2 style="font-size:16px;font-weight:600;margin:0 0 14px;line-height:1.5;color:var(--text);">'+item.q+'</h2>'+
    '<div id="opts">'+opts+'</div>'+fb+
    '<div style="display:flex;gap:8px;margin-top:4px;">'+
      '<button id="quit" class="btn" style="flex:1;background:#fff;color:var(--muted);border:1.5px solid var(--border);padding:11px;border-radius:12px;font-size:13px;font-weight:600;font-family:inherit;">Thoát</button>'+
      (i>0?'<button id="prev" class="btn" style="flex:1;background:rgba(128,128,128,.1);color:var(--text);border:1.5px solid var(--border);padding:11px;border-radius:12px;font-size:13px;font-weight:600;font-family:inherit;">Trước</button>':'')+
      '<button id="next" class="btn" style="flex:2;background:'+(answered?'var(--accent)':'#cbd5e1')+';color:'+(answered?'#fff':'#64748b')+';border:none;padding:11px;border-radius:12px;font-size:14px;font-weight:600;font-family:inherit;" '+(answered?'':'disabled')+'>'+(i===sub.q.length-1?'Hoàn thành':'Câu tiếp theo')+'</button></div>'+nav+'</div>';
  
  if(!answered){
    document.querySelectorAll('.opt').forEach(function(el){
      el.onclick=function(){
        var ch=parseInt(el.getAttribute('data-i'));
        var ok=ch===item.a;
        st.answers[i]={ok:ok,chosen:ch};
        if(ok){st.score++;okS();}else noS();
        renderQuiz();
      };
    });
  }
  document.getElementById('next').onclick=function(){if(i===sub.q.length-1)renderResult();else{st.idx++;renderQuiz();}};
  var pv=document.getElementById('prev');if(pv)pv.onclick=function(){st.idx--;renderQuiz();};
  document.getElementById('quit').onclick=function(){setStatus('menu');renderHome();};
  document.querySelectorAll('[data-jump]').forEach(function(el){el.onclick=function(){st.idx=parseInt(el.getAttribute('data-jump'));renderQuiz();};});
}

      advice = "Xem lại quy chuẩn nét vẽ (nét liền đậm, nét đứt, nét gạch chấm mảnh).";
    } else {

}

function thanosSnap2(el,container,done){
  var rect=el.getBoundingClientRect(), crect=container.getBoundingClientRect();
  var w=rect.width,h=rect.height;
  var canvas=document.createElement('canvas');
  canvas.id='snap-canvas';canvas.width=w*2;canvas.height=h*2;
  canvas.style.left=(rect.left-crect.left)+'px';canvas.style.top=(rect.top-crect.top)+'px';
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  container.appendChild(canvas);
  var ctx=canvas.getContext('2d');ctx.scale(2,2);
  var colors=['#ffffff','#ede9fe','#c4b5fd','#fbcfe8','#f5d0fe'];
  var ps=[];var cols=12,rows=9,cw=w/cols,ch=h/rows;
  for(var i=0;i<cols;i++)for(var j=0;j<rows;j++){
    if(Math.random()<0.3)continue;
    ps.push({x:i*cw+Math.random()*cw,y:j*ch+Math.random()*ch,vx:(Math.random()-0.5)*1.6,vy:-(Math.random()*2.2+0.6),size:Math.random()*3.5+1.5,color:colors[(Math.random()*colors.length)|0],life:1,decay:0.006+Math.random()*0.012,rot:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.12});
  }
  el.style.transition='opacity .3s ease';el.style.opacity='0';el.style.pointerEvents='none';
  var t=0;
  function frame(){
    ctx.clearRect(0,0,w,h);var alive=false;
    for(var i=0;i<ps.length;i++){var p=ps[i];if(p.life<=0)continue;alive=true;
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.015;p.vx*=0.99;p.rot+=p.vr;p.life-=p.decay;
      ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore();}
    t++;
    if(alive&&t<220)requestAnimationFrame(frame);
    else{canvas.remove();el.remove();done&&done();}
  }
  frame();
}
